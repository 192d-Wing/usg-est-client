name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

# Least-privilege default for GITHUB_TOKEN across all jobs (CodeQL
# actions/missing-workflow-permissions). Every job here only reads the repo;
# the coverage job uploads to Codecov via CODECOV_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (SLSA / supply-chain hardening); the
# trailing comment records the human-readable version. dtolnay/rust-toolchain
# is pinned to a SHA, so the toolchain must be named explicitly via `toolchain:`
# (the @stable/@beta ref aliases no longer carry that information once pinned).
jobs:
  # ===========================================================================
  # Test suite
  # ===========================================================================
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.92.0" # MSRV
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test --verbose
      # `--all-features` includes `fips-tls`, whose FIPS module (aws-lc-fips-sys)
      # only builds on Linux. FIPS is a Linux/Windows(CNG) target, never macOS, so
      # run the full feature set on Linux only; the dedicated `fips-tls` job covers
      # the FIPS build, and `test-features` covers individual non-FIPS features.
      - run: cargo test --all-features --verbose
        if: runner.os == 'Linux'
      - run: cargo test --no-default-features --verbose
        if: matrix.toolchain == 'stable'

  # Feature-specific tests
  test-features:
    name: Test features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - csr-gen
          - hsm
          - renewal
          - validation
          - metrics
          - revocation
          - enveloped
          - "hsm,csr-gen"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test --features "${{ matrix.features }}" --verbose

  # FIPS-validated cryptography via the aws-lc-rs FIPS module (TLS + PKI).
  # Linux-only (the FIPS module, aws-lc-fips-sys, builds on Linux x86_64/aarch64;
  # its build deps Go + cmake are preinstalled on the GitHub-hosted ubuntu runners).
  # NOTE: this verifies the FIPS *build* and that the provider reports FIPS mode;
  # it is not a CMVP-validated operating environment.
  fips:
    name: FIPS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # Include `validation` so cert-chain signature verification, and `enveloped`
      # so AES-CBC EnvelopedData decryption, are exercised through the aws-lc-rs
      # FIPS module (against the real cert fixtures / known-answer crypto tests).
      - run: cargo test --no-default-features --features fips,validation,enveloped --verbose
      # Verify the deprecated `fips-tls` alias still resolves to `fips`.
      - run: cargo build --no-default-features --features fips-tls

  # Windows platform integration (CNG key provider incl. CNG FIPS mode, cert
  # store, DPAPI, TPM). The `windows` feature is `cfg(windows)`-gated, so it is
  # only compiled on a Windows runner — without this job the entire Windows
  # module is never built or tested in CI.
  windows:
    name: Windows (${{ matrix.features }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: [windows, "windows,validation"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test --features "${{ matrix.features }}" --verbose

  # ===========================================================================
  # Lint
  # ===========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo clippy -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::expect_fun_call
      - name: Clippy (all features, lenient)
        run: cargo clippy --all-features -- -W warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::expect_fun_call

  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo doc --no-deps

  # ===========================================================================
  # Security
  # ===========================================================================
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436

  cargo-deny:
    name: Cargo deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check ${{ matrix.check }}

  security-clippy:
    name: Security clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Security-focused clippy lints (lib only, no test targets)
        run: |
          cargo clippy --lib --all-features -- \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::expect_fun_call \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::unreachable

  # ===========================================================================
  # Coverage
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: cargo-tarpaulin
      - run: cargo tarpaulin --all-features --out xml --output-dir coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
