name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write # cosign keyless signing + provenance attestation (OIDC)
  attestations: write # actions/attest-build-provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux arm64 (native aarch64 runners; no cross-compilation)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin est-enroll --features cli

      - name: Package (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY_NAME="est-enroll-${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/est-enroll" "$BINARY_NAME"
          sha256sum "$BINARY_NAME" > "$BINARY_NAME.sha256"
          tar -czf "$BINARY_NAME.tar.gz" "$BINARY_NAME"

      - name: Package (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $BINARY_NAME = "est-enroll-$VERSION-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/est-enroll.exe" $BINARY_NAME
          $hash = (Get-FileHash -Algorithm SHA256 $BINARY_NAME).Hash.ToLower()
          "$hash  $BINARY_NAME" | Out-File -Encoding ASCII "$BINARY_NAME.sha256"
          Compress-Archive -Path $BINARY_NAME -DestinationPath "$BINARY_NAME.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless + provenance (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts 2>/dev/null || true
          echo "# SHA256 Checksums for ${GITHUB_REF_NAME}" > checksums.txt
          echo "" >> checksums.txt
          cat *.sha256 >> checksums.txt

      # --- Supply-chain: SBOM (SR-4 / EO 14028) -----------------------------
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate release SBOM (CycloneDX)
        run: |
          cargo cyclonedx --all-features --format json
          # cargo-cyclonedx writes <crate>.cdx.json next to each manifest; the
          # root crate is usg-est-client. Collect it under a versioned name.
          SBOM="est-client-${GITHUB_REF_NAME#v}-cyclonedx.json"
          SRC="$(find . -path ./target -prune -o -name '*.cdx.json' -print | head -n1)"
          cp "$SRC" "artifacts/${SBOM}"
          ( cd artifacts && sha256sum "${SBOM}" >> checksums.txt )

      # --- Supply-chain: keyless signing of all artifacts (SI-7) ------------
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign artifacts (keyless / Sigstore)
        run: |
          cd artifacts
          for f in *.tar.gz *.zip *.json checksums.txt; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      # --- Supply-chain: SLSA build provenance (SR-4) -----------------------
      - name: Attest build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/est-client-*-cyclonedx.json

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.sig
            artifacts/*.pem
            artifacts/est-client-*-cyclonedx.json
            artifacts/checksums.txt
