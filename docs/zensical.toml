[project]
site_name = "USG EST Client"
site_description = "Documentation for the RFC 7030 EST client library."
site_author = "John Edward Willman V <mailto:john.willman.1@us.af.mil>"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/192d-Wing/usg-est-client"
repo_name = "192d-Wing/usg-est-client"
copyright = "Copyright &copy; 192d Wing"
nav = [
    { Overview = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { Configuration = [
        "configuration.md",
        "config-reference.md",
    ] },
    { Operations = [
        "operations.md",
        "revocation-guide.md",
        "revocation_status.md",
        "platform-tls.md",
    ] },
    { Security = "security.md" },
    { "Platform Guides" = [
        "windows-enrollment.md",
        "wasm-compatibility.md",
        { Enterprise = [
            "enterprise/group-policy.md",
        ] },
    ] },
    { Examples = "examples.md" },
    { Metrics = "metrics.md" },
    { Migration = "migration-from-adcs.md" },
    { Troubleshooting = "troubleshooting.md" },
]


[project.theme]
variant = "modern"
font.text = "Lato"
language = "en"
logo = "images/logo.png"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "search.highlight",
    "search.suggest",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = true

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
line_spans = "__span"

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
