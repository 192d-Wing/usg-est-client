[package]
name = "usg-est-client"
version = "2.1.3"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "RFC 7030 compliant EST (Enrollment over Secure Transport) client"
keywords = ["est", "pki", "certificate", "enrollment", "rfc7030"]
categories = ["cryptography", "network-programming"]
repository = "https://github.com/192d-Wing/usg-est-client"
readme = "README.md"


[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "sync"] }
async-trait = "0.1.89"

# HTTP client (rustls is default, native-tls available as optional backend)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Native TLS backend (optional, for platform-specific TLS)
native-tls = { version = "0.2", optional = true }

# TLS
rustls = "0.23.40"
# FIPS-validated crypto module (aws-lc-rs FIPS) used as the rustls TLS provider
# and for PKI operations (keygen, signing, verification) under the `fips` feature.
# The FIPS module (aws-lc-fips-sys) builds on Linux (x86_64/aarch64) only; Windows
# uses the CNG FIPS module instead. See docs/fips-compliance.md.
#
# Both crates are pinned to exact versions, for two different reasons:
#
#   aws-lc-rs      Upstream plans to switch aws-lc-fips-sys to the FIPS v4 branch
#                  in v1.18.0. That is a *minor* bump, so a caret requirement
#                  would silently move this build onto a different module branch.
#
#   aws-lc-fips-sys  This is the crate carrying the CMVP-validated C module, so it
#                  is what FIPS 140 validation actually attaches to. aws-lc-rs
#                  requires it only as `^0.13.16`, which leaves the validated
#                  module free to float across the 0.13.x range. Pinning aws-lc-rs
#                  alone does NOT constrain it. It is declared here as a direct
#                  dependency purely to pin that resolution — no code references
#                  it; all access goes through aws-lc-rs. A lockfile pin is not
#                  sufficient, because downstream consumers of this published
#                  crate resolve their own.
#
# When moving either pin, re-confirm the module version against the CMVP
# certificate Security Policy and update docs/fips-compliance.md to match.
aws-lc-rs = { version = "=1.17.3", optional = true }
aws-lc-fips-sys = { version = "=0.13.16", optional = true }
rustls-pki-types = { version = "1.14", features = ["alloc"] }
webpki-roots = "1.0"

# Cryptography - RustCrypto ecosystem
x509-cert = "0.3.0-rc.4"
der = { version = "0.8.0", features = ["alloc", "pem"] }
cms = "0.3.0-pre.2"
pkcs8 = { version = "0.11.0", features = ["encryption", "pem"] }
spki = { version = "0.8", features = ["alloc"] }
const-oid = { version = "0.10", features = ["db"] }
sha2 = "0.11"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
p256 = { version = "0.14.0-rc.12", features = ["ecdsa"] }
p384 = { version = "0.14.0-rc.12", features = ["ecdsa"] }
signature = "3.0"
zeroize = { version = "1.8", features = ["alloc", "derive"] }

# CSR generation (optional feature)
rcgen = { version = "0.14", optional = true }

# Encoding
base64 = "0.22.1"
getrandom = "0.4"

# Error handling
thiserror = "2.0.18"

# URL handling
url = "2.5.8"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }

# Configuration file parsing (optional, for auto-enrollment)
toml = { version = "1.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
dirs = { version = "6.0", optional = true }
hostname = { version = "0.4", optional = true }

# Date/time handling (optional, for renewal feature)
time = { version = "0.3", optional = true, features = [
    "formatting",
    "parsing",
    "macros",
] }
chrono = { version = "0.4", optional = true }

# PKCS#11 support (optional, for HSM integration)
cryptoki = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }
uuid = { version = "1.23", features = ["v4"], optional = true }

# Metrics exporters (optional, for metrics feature)
prometheus = { version = "0.14", optional = true }
opentelemetry = { version = "0.32.0", optional = true, features = ["metrics"] }
opentelemetry-prometheus = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = [
    "metrics",
] }

# Symmetric encryption for EnvelopedData decryption (optional)
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
des = { version = "0.9", optional = true }
aes-gcm = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }

# CLI support (optional, for est-enroll binary)
clap = { version = "4.6", features = ["derive"], optional = true }

# Windows platform support (optional, Windows-only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
], optional = true }
windows-service = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }

[[bin]]
name = "generate_fixtures"
path = "tests/fixtures/generate.rs"
required-features = ["csr-gen"]

[[example]]
name = "validate_chain"
required-features = ["validation"]

[[example]]
name = "metrics"
required-features = ["metrics"]

[[example]]
name = "pkcs11_enroll"
required-features = ["pkcs11", "csr-gen"]

[[example]]
name = "hsm_enroll"
required-features = ["hsm", "csr-gen"]

[[example]]
name = "auto_renewal"
required-features = ["renewal"]

[[example]]
name = "check_revocation"
required-features = ["revocation"]

[[example]]
name = "dod_enroll"
required-features = ["dod-pki", "csr-gen"]

[[example]]
name = "simple_enroll"
required-features = ["csr-gen"]

[[example]]
name = "cmc_advanced"
required-features = ["csr-gen"]

[[example]]
name = "reenroll"
required-features = ["csr-gen"]

[[bin]]
name = "est-autoenroll-service"
path = "src/bin/est-autoenroll-service.rs"
required-features = ["windows-service"]

[[bin]]
name = "est-service-install"
path = "src/bin/est-service-install.rs"
required-features = ["windows-service"]

[[bin]]
name = "est-enroll"
path = "src/bin/est-enroll.rs"
required-features = ["cli"]

[[bin]]
name = "est-migrate-keys"
path = "src/bin/est-migrate-keys.rs"
required-features = ["windows-service"]

[features]
default = ["csr-gen"]
csr-gen = ["rcgen"]
cli = ["clap", "auto-enroll", "tracing-subscriber"]
hsm = []
pkcs11 = ["hsm", "cryptoki", "hex", "uuid"]
renewal = ["time", "csr-gen"]
validation = []
metrics = []
metrics-prometheus = [
    "metrics",
    "prometheus",
    "opentelemetry",
    "opentelemetry-prometheus",
    "opentelemetry_sdk",
]
revocation = []
enveloped = ["aes", "cbc", "des", "aes-gcm", "hmac"]
auto-enroll = [
    "toml",
    "serde",
    "serde_json",
    "dirs",
    "hostname",
    "renewal",
    "csr-gen",
]
# SIEM integration (syslog forwarding, CEF, LEEF formats)
# Provides enterprise security monitoring integration
siem = ["serde", "serde_json", "chrono", "hostname"]

# Platform-specific TLS backends (alternative to default rustls)
# Use native-tls for OS-integrated TLS (SChannel on Windows, Security.framework on macOS, OpenSSL on Linux)
native-tls-backend = ["native-tls", "reqwest/native-tls"]
# Vendor OpenSSL for static linking on Linux (useful for musl/Alpine/Lambda deployments)
native-tls-vendored = ["native-tls-backend", "reqwest/native-tls-vendored"]

# Windows platform integration (certificate store, CNG, TPM)
# Note: Only compiles on Windows targets
# Pulls in `hsm` because the CNG key provider implements the hsm KeyProvider trait.
windows = ["dep:windows", "auto-enroll", "hsm"]

# Windows service support (includes windows feature)
# Note: Only compiles on Windows targets
windows-service = ["windows", "dep:windows-service", "tracing-subscriber"]

# FIPS 140-validated cryptography via the aws-lc-rs FIPS module.
# This is the unified FIPS feature: TLS (rustls provider) plus PKI operations
# (key generation, CSR/signature signing, certificate-chain verification) all run
# through the aws-lc-rs FIPS module.
#
# Linux only — `aws-lc-fips-sys` builds on Linux x86_64/aarch64 (its build deps
# Go + cmake are preinstalled on the GitHub-hosted ubuntu runners). On Windows,
# FIPS comes from the CNG FIPS module instead (see the `windows` feature and
# `CngKeyProvider::new_fips`); do not enable `fips` on Windows.
#
# Adds `hsm` + `csr-gen` so the KeyProvider trait + HsmCsrBuilder (manual,
# rcgen/ring-free CSR signing) are available for the FIPS AwsLcKeyProvider.
#
# NOTE: this build links the aws-lc-rs FIPS module but is NOT, by itself, a
# CMVP-validated operating environment — see docs/fips-compliance.md.
fips = [
    "dep:aws-lc-rs",
    # Pins the CMVP-validated module version; see the dependency comment above.
    "dep:aws-lc-fips-sys",
    "aws-lc-rs/fips",
    "rustls/fips",
    "hsm",
    "csr-gen",
]

# Deprecated alias for `fips`, retained for compatibility with the Phase 1-4
# migration. Prefer `fips`.
fips-tls = ["fips"]

# DoD PKI integration (DoD Root CAs, certificate policies, CAC/PIV support)
# Provides DoD-specific trust anchors and policy validation
dod-pki = []

# Full DoD deployment configuration (FIPS + DoD PKI)
# Use this for complete DoD ATO compliance
dod = ["fips", "dod-pki"]
